{% extends "base.html" %}

{% block title %}Page Not Found — Cartify{% endblock %}

{% block content %}
<div class="container my-5 text-center">
    <div class="display-1 fw-bold text-primary mb-3">404</div>
    <h3 class="fw-bold mb-2">Item or Page Not Found</h3>
    <p class="text-muted mb-4">{{ message or "The page you are looking for does not exist or has been moved." }}</p>
    <a href="{{ url_for('main.products') }}" class="btn btn-primary rounded-pill px-4 py-2">
        <i class="bi bi-grid me-2"></i> Browse All Products
    </a>
</div>
{% endblock %}
